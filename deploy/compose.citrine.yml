# Optional overlay: put the API on the CitrineOS compose network.
#
#   docker compose -f deploy/compose.yml -f deploy/compose.citrine.yml up -d --build
#
# Webhook URL from CitrineOS:
#   http://letscharge-api:3001/internal/citrine/ocpp?secret=
name: letscharge

networks:
  citrineos:
    external: true
    name: citrineos

services:
  letscharge-api:
    networks:
      - default
      - citrineos
