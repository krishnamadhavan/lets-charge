# Lab-only host-port remap. clean-my-car already publishes 3000 and 5432.
# Internal Docker network ports are unchanged (EVerest still uses :8081).
# Do not use this file in a first-society deploy.
services:
  citrine-ui:
    ports: !override
      - 3010:3000
  ocpp-db:
    ports: !override
      - 5434:5432
